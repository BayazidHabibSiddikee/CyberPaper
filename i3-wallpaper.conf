# ── Animated Wallpaper Keybinds ─────────────────────────────────
# Add to ~/.config/i3/config or keep as separate file

# Wallpaper autostart (uncomment one)
# exec --no-startup-id ~/animated-wallpaper/launch.sh gradient
# exec --no-startup-id ~/animated-wallpaper/launch.sh particles
# exec --no-startup-id ~/animated-wallpaper/launch.sh wave
# exec --no-startup-id ~/animated-wallpaper/launch.sh matrix
# exec --no-startup-id ~/animated-wallpaper/launch.sh graph

# Wallpaper mode switching
bindsym $mod+Ctrl+1 exec ~/animated-wallpaper/launch.sh gradient
bindsym $mod+Ctrl+2 exec ~/animated-wallpaper/launch.sh particles
bindsym $mod+Ctrl+3 exec ~/animated-wallpaper/launch.sh wave
bindsym $mod+Ctrl+4 exec ~/animated-wallpaper/launch.sh matrix
bindsym $mod+Ctrl+5 exec ~/animated-wallpaper/launch.sh graph
bindsym $mod+Ctrl+Tab exec ~/animated-wallpaper/launch.sh --next
bindsym $mod+Ctrl+Escape exec ~/animated-wallpaper/launch.sh --stop

# Night mode (redshift)
bindsym $mod+Ctrl+n exec redshift -O 3000
bindsym $mod+Ctrl+m exec redshift -x
