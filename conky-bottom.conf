-- conky-bottom.conf : bottom stat bar for cyberdeck desktop
-- Single-line HUD: time | cpu | ram | disk | net | music | uptime | host/kernel
-- Position: gap_y = CYBER_GAP_Y env var (default 1048 = 1080-32)

conky.config = {
    alignment              = 'top_left',
    gap_x                  = tonumber(os.getenv("CYBER_GAP_X") or "0"),
    gap_y                  = tonumber(os.getenv("CYBER_GAP_Y") or "1048"),
    minimum_width          = tonumber(os.getenv("CYBER_W")     or "1920"),
    maximum_width          = tonumber(os.getenv("CYBER_W")     or "1920"),
    minimum_height         = 32,

    own_window             = true,
    own_window_type       = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value  = 210,
    own_window_colour      = '000811',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    double_buffer          = true,
    update_interval        = 1,
    use_xft                = true,
    font                   = 'JetBrains Mono:bold:size=11',
    default_color          = '90dcff',
    background             = false,
    border_width           = 0,
    draw_shades            = false,
    draw_borders           = false,
    draw_outline           = false,
    no_buffers             = true,
}

-- Helper: CPU colour thresholds (green < 50, amber < 80, red >= 80)
-- conky's ${if_match} is used to pick colour before printing the value.
-- Layout (all on one line):
--   [CYBER] HH:MM:SS  Day DD Mon  │  ⚡ CPU: XX%  🌡 XXC  │  🧠 RAM: XX%  │
--   💾 /: XX%  │  ↓ XX KB/s  ↑ XX KB/s  │  ♫ artist – title  │  ↑ uptime  │  host  kernel

conky.text = [[${font JetBrains Mono:bold:size=11}${color 00ffcc}[CYBER]${color 90dcff}  ${time %H:%M:%S}  ${time %a %d %b}  ${color 2a5a7a}│${color 90dcff}  ⚡ CPU: ${if_match ${cpu}>79}${color ff4040}${else}${if_match ${cpu}>49}${color ffb347}${else}${color 50fa7b}${endif}${endif}${cpu}%${color 90dcff}  🌡 ${execi 4 sensors 2>/dev/null | awk '/^(Core 0|CPU Temp|Package id 0|Tdie|k10temp)/{gsub(/[^0-9.]/,"",$3); printf "%d", $3; found=1; exit} END{if(!found) print "?"}'}C  ${color 2a5a7a}│${color 90dcff}  🧠 RAM: ${memperc}%  ${color 2a5a7a}│${color 90dcff}  💾 /: ${fs_used_perc /}%  ${color 2a5a7a}│${color 90dcff}  ${execi 2 ~/animated-wallpaper/net-speed.sh}  ${color 2a5a7a}│${color 90dcff}  ${execi 2 playerctl metadata --format '♫ {{artist}} – {{title}}' 2>/dev/null | head -c 60 || echo '♫ —'}  ${color 2a5a7a}│${color 90dcff}  ↑ ${uptime_short}  ${color 2a5a7a}│${color 6af0c8}  ${nodename}  ${color 4a8aaa}${execi 60 uname -r | cut -d- -f1}${font}]]
