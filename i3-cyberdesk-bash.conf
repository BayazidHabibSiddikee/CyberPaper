# ── Cyberdesk (bash/C-tools version) — add to ~/.config/i3/config ──

# Autostart on login
exec --no-startup-id ~/animated-wallpaper-bash/cyberdesk.sh start

# Controls
bindsym $mod+Ctrl+6 exec ~/animated-wallpaper-bash/cyberdesk.sh restart
bindsym $mod+Ctrl+Escape exec ~/animated-wallpaper-bash/cyberdesk.sh stop
bindsym $mod+Ctrl+e exec ~/animated-wallpaper-bash/cyberdesk.sh edit
