-- conky-stats.conf : bottom cyber stat bar
-- Uses top_left + explicit CYBER_GAP_Y (= SH - BOTTOM_H) for reliable placement.
conky.config = {
    alignment         = 'top_left',
    gap_x             = tonumber(os.getenv("CYBER_GAP_X") or "0"),
    gap_y             = tonumber(os.getenv("CYBER_GAP_Y") or "1048"),
    minimum_width     = tonumber(os.getenv("CYBER_W") or "1920"),
    maximum_width     = tonumber(os.getenv("CYBER_W") or "1920"),
    minimum_height    = tonumber(os.getenv("CYBER_H") or "32"),

    own_window        = true,
    own_window_type   = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value  = 200,
    own_window_hints  = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    double_buffer     = true,
    update_interval   = 1,
    use_xft           = true,
    font              = 'monospace:size=10',
    default_color     = '90DCFF',
    background        = false,
    border_width      = 0,
    draw_shades       = false,
    draw_borders      = false,
}

conky.text = [[${color 90DCFF}${font monospace:bold:size=11}${time %H:%M:%S  %a %d %b}${font}   ${color 96F0C8}CPU ${cpu}%  RAM ${memperc}%  DISK ${fs_used_perc /}%  NET ${execi 2 ~/animated-wallpaper/net-speed.sh}   ${color 90E8FF}${execi 2 playerctl metadata --format '♫ {{artist}} – {{title}}' 2>/dev/null || echo '♫ —'}]]
