conky.config = {

    -- ── Window / Geometry ──────────────────────────────────
    own_window            = true,
    own_window_type       = 'desktop',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_argb_visual = true,
    own_window_argb_value = 220,
    own_window_colour     = '#020510',

    -- Read position from environment; fall back to spec defaults
    gap_x                 = tonumber(os.getenv('CYBER_GAP_X')) or 1383,
    gap_y                 = tonumber(os.getenv('CYBER_GAP_Y')) or 22,
    minimum_width         = tonumber(os.getenv('CYBER_W'))     or 537,
    maximum_width         = tonumber(os.getenv('CYBER_W'))     or 537,
    minimum_height        = tonumber(os.getenv('CYBER_H'))     or 1026,
    alignment             = 'top_left',

    -- ── Drawing ───────────────────────────────────────────
    double_buffer         = true,
    draw_shades           = false,
    draw_outline          = false,
    draw_borders          = false,
    border_width          = 0,

    -- ── Fonts ─────────────────────────────────────────────
    use_xft               = true,
    font                  = 'JetBrains Mono:size=10',
    xftalpha              = 1.0,
    override_utf8_locale  = true,

    -- ── Colours (defaults) ────────────────────────────────
    -- primary  #00d4ff  cyan
    -- accent   #00ffcc  green
    -- warn     #ffc800  amber
    -- crit     #ff465a  red
    default_color         = '00d4ff',
    default_shade_color   = '000000',
    default_outline_color = '000000',

    -- ── Behaviour ─────────────────────────────────────────
    update_interval       = 2.0,
    cpu_avg_samples       = 2,
    net_avg_samples       = 2,
    diskio_avg_samples    = 4,
    no_buffers            = true,
    short_units           = true,
    use_spacer            = 'none',
    pad_percents          = 3,
    top_name_width        = 16,

    -- ── Graphs ────────────────────────────────────────────
    -- cpugraph dimensions set inline below
};

