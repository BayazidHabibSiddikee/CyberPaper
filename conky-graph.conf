-- conky-graph.conf : center mission graph panel
-- Reads position/size from env vars set by cyberdesk.sh:
--   CYBER_GAP_X  CYBER_GAP_Y  CYBER_W  CYBER_H
conky.config = {
    alignment         = 'top_left',
    gap_x             = tonumber(os.getenv("CYBER_GAP_X") or "0"),
    gap_y             = tonumber(os.getenv("CYBER_GAP_Y") or "0"),
    minimum_width     = tonumber(os.getenv("CYBER_W") or "800"),
    maximum_width     = tonumber(os.getenv("CYBER_W") or "800"),
    minimum_height    = tonumber(os.getenv("CYBER_H") or "1000"),

    own_window        = true,
    own_window_type   = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value  = 0,
    own_window_hints  = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    double_buffer     = true,
    update_interval   = 2,
    border_width      = 0,
    background        = false,
    draw_shades       = false,
    draw_borders      = false,
}

conky.text = [[${image ~/.config/animated-wallpaper/graph.png -p 0,0}]]
